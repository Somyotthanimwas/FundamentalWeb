name: Build FundamentalWebUploader

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tools/FundamentalWebUploader -B tools/FundamentalWebUploader/build -A x64

      - name: Build
        run: cmake --build tools/FundamentalWebUploader/build --config Release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FundamentalWebUploader-Windows-x64
          path: tools/FundamentalWebUploader/build/Release/FundamentalWebUploader.exe

name: Build FundamentalWebUploader

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install curl with vcpkg
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows-static

      - name: Configure
        shell: pwsh
        run: |
          cmake -S tools/FundamentalWebUploader -B tools/FundamentalWebUploader/build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: |
          cmake --build tools/FundamentalWebUploader/build --config Release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v5
        with:
          name: FundamentalWebUploader-Windows-x64
          path: tools/FundamentalWebUploader/build/Release/FundamentalWebUploader.exe
